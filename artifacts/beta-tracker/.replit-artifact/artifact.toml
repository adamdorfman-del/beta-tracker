kind = "web"
previewPath = "/"
title = "Beta Tracker"
version = "1.0.0"
id = "artifacts/beta-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23279

[services.development]
run = "pnpm --filter @workspace/beta-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beta-tracker", "run", "build" ]
publicDir = "artifacts/beta-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23279"
BASE_PATH = "/"
